plugins {
    id 'net.minecraftforge.gradle' version '[6,7)'
    id 'eclipse'
    id 'maven-publish'
}

group = 'com.victorminono'
version = '1.0.0'
archivesBaseName = 'doppio_DK'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            arg '-mixin.config=doppio_dk.mixins.json'
            
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.level', 'debug'

            mods {
                clonemod {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            arg '-mixin.config=doppio_dk.mixins.json'
            
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.level', 'debug'

            mods {
                clonemod {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run')
            
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.level', 'debug'

            mods {
                clonemod {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            args '--mod', 'clonemod', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                clonemod {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven { url 'https://maven.minecraftforge.net' }
    maven { url 'https://maven.parchmentmc.org' }
    maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.2.0"
    
    // WebSocket - Java-WebSocket
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'
    
    // JSON parsing - Gson
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'doppio_DK',
            'Specification-Vendor'    : 'victorminono',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'victorminono',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
